{# a government-ownership tag; expects `tag` (a psu row) and optional `size` #}
{% if tag %}<span class="badge {{ size or 'badge-xs' }} {% if tag.owner == 'central' %}badge-warning{% elif tag.owner == 'state' %}badge-warning badge-outline{% else %}badge-ghost{% endif %} whitespace-nowrap" title="{% if tag.owner == 'central' %}Central public-sector undertaking{% elif tag.owner == 'state' %}State government undertaking{% else %}Promoted by PSUs but not government-controlled{% endif %}{% if tag.parent %} · held through {{ tag.parent }}{% endif %}{% if tag.note %} · {{ tag.note }}{% endif %}"><i class="mdi mdi-bank-outline mr-0.5"></i>{% if tag.owner == 'central' %}Govt · {{ tag.category }}{% elif tag.owner == 'state' %}State govt{% else %}PSU-promoted{% endif %}</span>{% endif %}
