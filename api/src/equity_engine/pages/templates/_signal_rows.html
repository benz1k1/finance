{% for s in signals %}
<tr>
  <td><a class="link link-primary font-medium" href="/equities/{{ s.symbol | urlencode }}">{{ s.symbol }}</a></td>
  <td><a class="link link-hover" href="/engine/{{ s.engine_key }}">{{ s.engine_name }}</a></td>
  <td class="whitespace-nowrap"><span class="font-medium {{ DIRECTION_CLASS[s.direction] }}">{{ s.signal_type | replace('_', ' ') | lower }}</span></td>
  <td><span class="badge badge-xs {{ STAGE_CLASS[s.stage] }}">{{ s.stage | lower }}</span></td>
  <td class="n">{{ s.strength | num(2) }}</td>
  <td class="n">{{ s.percentile | num(0) }}</td>
  <td class="text-xs" title='{{ s.evidence | tojson }}'>{{ s.headline }}</td>
  <td class="text-xs text-base-content/60">{{ s.invalidation }}</td>
</tr>
{% else %}
<tr><td colspan="8" class="text-base-content/60">No signal matches these filters.</td></tr>
{% endfor %}
